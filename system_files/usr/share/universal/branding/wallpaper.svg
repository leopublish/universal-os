<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="0.6" stop-color="#101d2e"/>
      <stop offset="1" stop-color="#0a1119"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.8" cy="1.1" r="0.75">
      <stop offset="0" stop-color="#1f8f86" stop-opacity="1"/>
      <stop offset="1" stop-color="#1f8f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink" cx="0.12" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#2a3f6b" stop-opacity="1"/>
      <stop offset="1" stop-color="#2a3f6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#ink)"/>
  <rect width="1920" height="1080" fill="url(#teal)"/>
  <!-- the meridian: a great arc rising over the horizon -->
  <circle cx="960" cy="2260" r="1640" fill="none" stroke="#f2a541" stroke-opacity=".35" stroke-width="18" filter="url(#glow)"/>
  <circle cx="960" cy="2260" r="1640" fill="none" stroke="#f2a541" stroke-opacity=".75" stroke-width="2.5"/>
  <circle cx="960" cy="2260" r="1700" fill="none" stroke="#2bb3a3" stroke-opacity=".18" stroke-width="1.5"/>
</svg>
