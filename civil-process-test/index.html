<script>window.QUIZ={"id": "civil-process", "code": "CP", "subject": "Гражданский процесс", "title": "От иска до решения", "description": "Возбуждение и подготовка гражданских дел, судебное разбирательство и постановления суда первой инстанции по ГПК Республики Узбекистан.", "topics": ["Возбуждение дела: принятие, отказ, возвращение заявления", "Подготовка дела к судебному разбирательству", "Судебное разбирательство, отложение и приостановление", "Решения и определения суда первой инстанции"], "source": "Основано на лекционном материале ТГЮУ по ГПК Республики Узбекистан", "minutes": 20, "passMark": 70, "url": "https://leopublish.github.io/universal-os/civil-process-test/", "catalog": "../tests/", "sheetUrl": "","questions":[
{t:'Возбуждение дела',q:'В какой срок судья решает вопрос о принятии искового заявления к производству?',o:['Не позднее 10 дней со дня поступления заявления','Не позднее 3 дней','Не позднее 5 дней','Не позднее 20 дней'],e:'Судья единолично не позднее десяти дней решает вопрос о принятии, отказе в принятии либо возвращении заявления и выносит об этом определение.',a:'ст. 192 ГПК'},
{t:'Возбуждение дела',c:'Гражданин подал иск о взыскании долга, но не приложил документ об уплате госпошлины и не просил об отсрочке.',q:'Как поступит судья?',o:['Вернёт заявление с приложенными документами','Откажет в принятии заявления','Прекратит производство по делу','Приостановит производство по делу'],e:'Отсутствие документа об уплате госпошлины и почтовых расходов — основание для возвращения заявления. Устранив недостаток, истец может подать иск снова.',a:'ст. 195 ГПК, п. 7'},
{t:'Возбуждение дела',q:'Чем отказ в принятии заявления отличается от его возвращения?',o:['Отказ не даёт повторно подать тот же иск, а после возвращения можно обратиться снова, устранив нарушения','После возвращения повторно обратиться нельзя, а после отказа — можно','Ничем: в обоих случаях повторное обращение невозможно','Определение об отказе нельзя обжаловать частной жалобой'],e:'Отказ препятствует повторному иску к тому же ответчику, о том же предмете и по тем же основаниям. Возвращение не мешает обратиться в общем порядке после устранения нарушений.',a:'ст. 194, 195 ГПК'},
{t:'Последствия возбуждения дела',q:'Какое последствие возбуждения дела относится к процессуально-правовым?',o:['Ответчик получает право предъявить встречный иск','Прерывается течение срока исковой давности','Алименты присуждаются с момента предъявления иска','Добросовестный владелец обязан вернуть доходы со времени получения повестки'],e:'Право на встречный иск — процессуальное последствие. Остальные варианты относятся к материально-правовым последствиям предъявления иска.',a:'ст. 199 ГПК; ст. 157, 230 ГК'},
{t:'Подготовка дела',q:'Какой срок установлен для подготовки дела к судебному разбирательству?',o:['10 дней, в исключительных случаях — до 20 дней','5 дней, в исключительных случаях — до 10 дней','15 дней без права продления','1 месяц, в исключительных случаях — до 2 месяцев'],e:'Подготовка проводится в десятидневный срок. По делам особой сложности судья может продлить его до 20 дней, вынеся мотивированное определение.',a:'ст. 202 ГПК'},
{t:'Подготовка дела',q:'Можно ли обжаловать определения, вынесенные при подготовке дела?',o:['Нет, кроме определений по обеспечению иска и об отказе в обеспечении доказательств','Да, любое такое определение обжалуется частной жалобой','Да, но только вместе с решением суда','Нет, без каких-либо исключений'],e:'Эти определения не преграждают дальнейшее движение дела, поэтому не обжалуются. Исключение — вопросы обеспечения иска и отказ в обеспечении доказательств.',a:'Пост. Пленума ВС РУз № 26 от 24.08.2018'},
{t:'Подготовка дела',c:'Истица требует взыскать алименты, но где сейчас находится ответчик, неизвестно.',q:'Что должен сделать суд?',o:['Вынести определение о розыске ответчика органами внутренних дел','Оставить заявление без рассмотрения','Вернуть заявление истице','Рассмотреть дело без розыска: по таким делам он не проводится'],e:'По искам о взыскании алиментов и о возмещении вреда, причинённого увечьем, иным повреждением здоровья или смертью кормильца, розыск ответчика обязателен.',a:'ст. 165 ГПК'},
{t:'Судебное разбирательство',q:'Что НЕ входит в число частей судебного заседания по гражданскому делу?',o:['Предварительное следствие','Подготовительная часть','Судебные прения','Постановление и оглашение решения'],e:'Заседание состоит из четырёх частей: подготовительной, рассмотрения дела по существу, судебных прений, постановления и оглашения решения. Следствие относится к уголовному процессу.',a:'Структура судебного заседания'},
{t:'Судебное разбирательство',c:'Дело особо сложное. Судья не успевает составить мотивированное решение в день окончания разбирательства.',q:'Как следует поступить?',o:['Объявить резолютивную часть в том же заседании, а мотивированное решение составить не позднее чем через 5 дней','Отложить вынесение всего решения на 10 дней','Огласить решение целиком через месяц','Отложить разбирательство и начать его заново'],e:'Составление мотивированного решения можно отложить не более чем на пять дней. Резолютивная часть объявляется в том же заседании, подписывается судьёй и приобщается к делу.',a:'ч. 4 ст. 249 ГПК'},
{t:'Приостановление',c:'Во время процесса умер гражданин-ответчик. Спорное правоотношение допускает правопреемство.',q:'Что должен сделать суд?',o:['Приостановить производство по делу — это его обязанность','Прекратить производство по делу','Оставить заявление без рассмотрения','Вынести заочное решение'],e:'Смерть гражданина-стороны при допустимом правопреемстве — основание обязательного приостановления. Если правопреемство невозможно, производство прекращается.',a:'ст. 116, 124 ГПК'},
{t:'Окончание без решения',q:'Какое основание ведёт к прекращению производства, а не к оставлению заявления без рассмотрения?',o:['Стороны заключили мировое соглашение, и суд его утвердил','Истец без уважительных причин не явился по вторичному вызову','Не соблюдён досудебный порядок урегулирования спора','Заявление подано недееспособным лицом'],e:'Утверждённое мировое соглашение прекращает производство, и тот же иск подать повторно нельзя. Остальные случаи — оставление без рассмотрения: устранив причину, можно обратиться снова.',a:'ст. 122, 124 ГПК'},
{t:'Мировое соглашение',q:'В каком случае суд откажет в утверждении мирового соглашения?',o:['Если его условия противоречат законодательству или затрагивают права третьих лиц','Если одна сторона уступила больше, чем другая','Если соглашение заключено вне судебного заседания','Если соглашение заключено после начала судебных прений'],e:'Суд проверяет законность условий и интересы третьих лиц. Об отказе выносится определение, которое можно обжаловать (опротестовать).',a:'ст. 169 ГПК'},
{t:'Решение суда',q:'В какой части решения суд указывает доказательства, на которых основаны его выводы, и применённые нормы права?',o:['В мотивировочной','Во вводной','В описательной','В резолютивной'],e:'Мотивировочная часть содержит установленные обстоятельства, доказательства, доводы, по которым суд отверг другие доказательства, и нормы материального и процессуального права.',a:'ст. 253 ГПК'},
{t:'Виды решений',c:'Ответчика надлежаще известили о времени и месте заседания, но он не явился и не просил рассмотреть дело без него.',q:'Какое решение может вынести суд?',o:['Заочное','Дополнительное','Судебный приказ','Частное определение вместо решения'],e:'Заочное решение выносится в отсутствие надлежаще извещённого ответчика, который не явился и не заявил письменной просьбы о рассмотрении дела без него.',a:'Виды судебных решений'},
{t:'Законная сила решения',q:'Какое свойство законной силы означает, что установленные решением факты не исследуются заново в другом деле с теми же лицами?',o:['Преюдициальность','Исключительность','Неопровержимость','Исполнимость'],e:'Обстоятельства, установленные вступившим в силу решением, обязательны для суда и не доказываются повторно в другом деле, где участвуют те же лица.',a:'Свойства законной силы решения'}
]};</script>
