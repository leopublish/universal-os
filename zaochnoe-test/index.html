<script>window.QUIZ={"id": "zaochnoe", "code": "ZP", "subject": "Гражданский процесс", "title": "Заочное производство", "description": "Глава 26 ГПК Республики Узбекистан (ст. 280–292): основания, порядок, заочное решение, пересмотр и отмена.", "topics": ["Основания заочного производства и права истца", "Порядок рассмотрения и заочное решение", "Заявление о пересмотре заочного решения", "Отмена решения и возобновление дела"], "source": "Основано на главе 26 ГПК Республики Узбекистан", "minutes": 20, "passMark": 70, "url": "https://leopublish.github.io/universal-os/zaochnoe-test/", "catalog": "../tests/", "sheetUrl": "","questions":[
{t:'Основания',q:'Какое условие НЕ требуется для рассмотрения дела в заочном порядке?',o:['Письменное согласие ответчика на заочное производство','Ответчик надлежаще извещён о времени и месте заседания','Ответчик не сообщил об уважительных причинах неявки','Истец не возражает против заочного производства'],e:'Нужны неявка надлежаще извещённого ответчика, отсутствие сообщения об уважительных причинах и просьбы рассмотреть дело без него, а также отсутствие возражений истца. Согласие ответчика не требуется. О заочном порядке суд выносит определение.',a:'ст. 280 ГПК'},
{t:'Основания',c:'В деле три ответчика. Двое пришли в заседание, третий надлежаще извещён, но не явился.',q:'Можно ли рассмотреть дело заочно?',o:['Нет: при нескольких ответчиках нужна неявка всех','Да, в отношении того, кто не явился','Да, если двое явившихся согласны','Да, если не явился главный ответчик'],e:'Если ответчиков несколько, заочное производство возможно только при неявке в заседание всех ответчиков.',a:'ч. 2 ст. 280 ГПК'},
{t:'Права истца',c:'Ответчик надлежаще извещён и не явился. Истец пришёл и против заочного рассмотрения.',q:'Что сделает суд?',o:['Отложит разбирательство и повторно известит ответчика','Всё равно рассмотрит дело заочно','Оставит заявление без рассмотрения','Прекратит производство по делу'],e:'Если явившийся истец не согласен на заочное производство, суд откладывает разбирательство и направляет ответчику повторное извещение.',a:'ч. 1 ст. 281 ГПК'},
{t:'Права истца',q:'Как поступит суд, если надлежаще извещённый ответчик не явился повторно, а истец по-прежнему против заочного производства?',o:['Рассмотрит дело заочно независимо от мнения истца','Снова отложит разбирательство','Оставит заявление без рассмотрения','Объявит розыск ответчика'],e:'При повторной неявке надлежаще извещённого ответчика возражение истца уже не останавливает суд: дело рассматривается заочно.',a:'ч. 2 ст. 281 ГПК'},
{t:'Порядок',q:'Чем ограничивается суд при заочном производстве?',o:['Исследованием доказательств, которые уже есть в деле','Только объяснениями истца','Доказательствами, которые ответчик пришлёт после заседания','Ничем — он собирает новые доказательства по своей инициативе'],e:'Суд исследует имеющиеся в деле доказательства, учитывает доводы и ходатайства участников и выносит решение, которое называется заочным.',a:'ч. 1 ст. 282 ГПК'},
{t:'Порядок',c:'В заседании, где ответчика нет, истец увеличил размер исковых требований.',q:'Может ли суд вынести заочное решение в этом заседании?',o:['Нет: рассмотрение откладывается, чтобы вручить ответчику изменённый иск','Да, если увеличение небольшое','Да, но только по первоначальной сумме','Да, если истец письменно об этом просит'],e:'При изменении предмета, основания или размера иска суд не вправе рассматривать дело заочно в этом заседании и откладывает его для вручения ответчику изменённого иска.',a:'ч. 2 ст. 282 ГПК'},
{t:'Порядок',c:'Ответчик не явился, но заранее прислал заявление: «Прошу рассмотреть дело без моего участия».',q:'В каком порядке рассмотрят дело?',o:['В общем порядке, решение не будет заочным','В заочном порядке','Дело отложат до явки ответчика','Заявление истца оставят без рассмотрения'],e:'Если неявившийся ответчик просил рассмотреть дело без него, дело рассматривается в общем порядке, а не заочно.',a:'ч. 3 ст. 282 ГПК'},
{t:'Заочное решение',q:'Что обязательно указывается в резолютивной части заочного решения, помимо общих требований?',o:['Срок и порядок подачи заявления о пересмотре решения','Причины неявки ответчика','Согласие истца на заочное производство','Список свидетелей, которые не явились'],e:'Содержание заочного решения подчиняется общим правилам ст. 253, но в резолютивной части дополнительно указываются срок и порядок подачи заявления о пересмотре.',a:'ст. 283 ГПК'},
{t:'Заочное решение',q:'В какой срок сторонам направляется копия заочного решения?',o:['Не позднее 5 дней со дня вынесения','Не позднее 3 дней','Не позднее 10 дней','Не позднее 15 дней'],e:'Копия направляется заказным письмом с уведомлением, вручается под расписку или, при наличии электронного адреса, отправляется электронным документом.',a:'ст. 284 ГПК'},
{t:'Пересмотр',c:'Заочное решение принято 1 марта. Ответчик узнал о нём и хочет добиться отмены в том же суде.',q:'Сколько у него времени на заявление о пересмотре?',o:['15 дней после принятия решения','10 дней после получения копии','1 месяц после принятия решения','5 дней после принятия решения'],e:'Ответчик вправе подать заявление о пересмотре в суд, принявший заочное решение, в течение пятнадцати дней после его принятия.',a:'ст. 285 ГПК'},
{t:'Пересмотр',q:'Нужно ли платить госпошлину за заявление о пересмотре заочного решения?',o:['Нет, заявление не облагается госпошлиной','Да, как за исковое заявление','Да, в половинном размере','Только если ответчик — юридическое лицо'],e:'Заявление подаётся с копиями по числу лиц, участвующих в деле (кроме электронного), и государственной пошлиной не оплачивается.',a:'ст. 286 ГПК'},
{t:'Пересмотр',q:'В какой срок суд рассматривает заявление о пересмотре заочного решения?',o:['В течение 10 дней с момента поступления','В течение 5 дней','В течение 15 дней','В течение 1 месяца'],e:'Заявление рассматривается в заседании в течение десяти дней. Неявка извещённых лиц не мешает его рассмотреть.',a:'ч. 1 ст. 288 ГПК'},
{t:'Пересмотр',q:'Можно ли обжаловать определение суда об отмене заочного решения или об отказе в отмене?',o:['Нет, такое определение не обжалуется и не опротестовывается','Да, частной жалобой в течение 10 дней','Да, только прокурором','Да, вместе с заочным решением в кассации'],e:'Определение об отмене заочного решения либо об отказе в отмене обжалованию (опротестованию) не подлежит. При этом само заочное решение можно обжаловать в общем порядке (ст. 285¹).',a:'ч. 2 ст. 288 ГПК'},
{t:'Отмена решения',c:'Ответчик пропустил заседание, потому что лежал в больнице и не мог сообщить суду. Новых доказательств по существу спора у него нет.',q:'Отменит ли суд заочное решение?',o:['Нет: нужны и уважительная причина, и доказательства, способные повлиять на решение','Да, уважительной причины достаточно','Да, если истец не возражает','Да, любое заочное решение отменяется по заявлению ответчика'],e:'Решение отменяется, только если неявка вызвана уважительными причинами, о которых сторона не могла сообщить, и сторона представляет доказательства, способные повлиять на решение. Нужны оба условия.',a:'ст. 290 ГПК'},
{t:'Возобновление',c:'Заочное решение отменили, дело рассматривают заново. Надлежаще извещённый ответчик снова не пришёл.',q:'Каким будет новое решение?',o:['Обычным: оно не признаётся заочным, повторный пересмотр невозможен','Снова заочным, с правом на новый пересмотр','Дело оставят без рассмотрения','Суд обязан отложить дело до явки ответчика'],e:'При новом рассмотрении решение, вынесенное в отсутствие извещённого ответчика, не признаётся заочным, и подать заявление о его пересмотре как заочного уже нельзя.',a:'ч. 2 ст. 291 ГПК'}
]};</script>
